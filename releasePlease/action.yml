name: release-please-go
description: Go port of the core of googleapis/release-please
inputs:
  token:
    description: GitHub token. The workflow's built-in GITHUB_TOKEN works; see README for the permissions it needs.
    default: ${{ github.token }}
  command:
    description: release-pr, github-release or all
    default: all
  release-type:
    description: auto, simple, go or java-gradle
    default: auto
  args:
    description: Extra flags, e.g. "--extra-files=version.go --bump-minor-pre-major"
    default: ""
outputs:
  release_created:
    description: "true if a release was created"
    value: ${{ steps.run.outputs.release_created }}
  tag_name:
    description: Tag of the created release
    value: ${{ steps.run.outputs.tag_name }}
  version:
    description: Version of the created release
    value: ${{ steps.run.outputs.version }}
  html_url:
    description: URL of the created release
    value: ${{ steps.run.outputs.html_url }}
  pr:
    description: Number of the release PR
    value: ${{ steps.run.outputs.pr }}
  pr_url:
    description: URL of the release PR
    value: ${{ steps.run.outputs.pr_url }}
runs:
  using: composite
  steps:
    # GitHub-hosted runners ship with Go, so only install it when missing.
    # This avoids changing the Go version a Go repo's own workflow set up.
    - id: go
      shell: bash
      run: echo "missing=$(command -v go >/dev/null && echo false || echo true)" >> "$GITHUB_OUTPUT"
    - if: steps.go.outputs.missing == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"
        cache: false
    - id: run
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        # Isolate the build from the calling repository's Go settings.
        GOFLAGS: ""
        GOWORK: "off"
        GOTOOLCHAIN: auto
      run: go run . --release-type '${{ inputs.release-type }}' ${{ inputs.args }} ${{ inputs.command }}
